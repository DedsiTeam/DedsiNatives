# 本仓库的默认执行模型：使用 Sol，并以均衡推理作为日常默认值。
model = "gpt-5.6-sol"
model_reasoning_effort = "medium"

# Azure DevOps 是工作项、分支、PR 与流水线状态的唯一远程事实来源。
# 通过本地 stdio MCP Server 使用 PAT。启动器从被 Git 忽略的 .env.local
# 读取原始 ADO_PAT 并在内存中转换为 MCP 要求的 Base64；也支持宿主预设 PERSONAL_ACCESS_TOKEN。
[mcp_servers.ado]
command = "node"
args = [
  ".codex/ado-mcp-pat.mjs",
  "{{ADO_ORG}}",
  "--authentication",
  "pat",
  "-d",
  "core",
  "work-items",
  "repositories",
  "pipelines",
]
required = true
startup_timeout_sec = 60
tool_timeout_sec = 120

[mcp_servers.ado.env]
ado_mcp_project = "{{ADO_PROJECT}}"

[agents]
enabled = true
max_concurrent_threads_per_session = 3
default_subagent_model = "gpt-5.6-terra"
default_subagent_reasoning_effort = "medium"
